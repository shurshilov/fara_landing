# faracrm.com — Landing
server {
    listen 80;
    server_name faracrm.com www.faracrm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name faracrm.com www.faracrm.com;

    ssl_certificate /etc/letsencrypt/live/faracrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faracrm.com/privkey.pem;

    location / {
        proxy_pass http://landing:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

    }

    # Сама политика CSP
    # Ограничение возможностей JS и ресурсов
    # Разбор директив (что они защищают):
    # default-src 'self': Разрешает загрузку ресурсов только с вашего домена. Это база.
    # script-src 'self': Разрешает выполнение JS-файлов только с вашего сервера. Запрещает inline-скрипты (те, что в HTML-формах).
    # connect-src 'self': Ограничивает адреса, куда JS может отправлять запросы (fetch/XHR). Скрипт не сможет отправить украденный токен на hacker.com.
    # object-src 'none': Запрещает плагины вроде Flash (старый, но опасный вектор).
    # frame-ancestors 'none': Запрещает встраивать ваш сайт в iframe на других ресурсах (защита от кликджекинга).
    add_header Content-Security-Policy "
        default-src 'self'; 
        script-src 'self'; 
        style-src 'self' https://fonts.googleapis.com; 
        img-src 'self' data:; 
        connect-src 'self'; 
        font-src 'self' https://fonts.gstatic.com; 
        object-src 'none'; 
        frame-ancestors 'none'; 
        base-uri 'self'; 
        form-action 'self';
    " always;

    # Дополнительные заголовки безопасности

    # Запрет угадывания типов файлов
    # Проблема: Представьте, что на ваш сайт можно загрузить аватарку. Хакер загружает текстовый файл со скриптом внутри, но называет его image.jpg. Некоторые браузеры могут подумать: «Хм, это не похоже на картинку, это похоже на JavaScript!» — и выполнят его.
    # Как работает "nosniff": Он жестко говорит браузеру: «Верь тому типу (Content-Type), который прислал сервер». Если сервер говорит, что это image/jpeg, браузер никогда не попытается исполнить этот файл как скрипт.
    # Зачем вам: Это базовая защита от XSS через загрузку файлов
    add_header X-Content-Type-Options "nosniff" always;

    # Защита от Clickjacking (кража клика)
    # Проблема: Злоумышленник может создать свой сайт и поверх него наложить невидимый <iframe> с вашим сайтом. Пользователь думает, что кликает по кнопке «Выиграть приз» на сайте хакера, а на самом деле нажимает на кнопку «Удалить аккаунт» или «Перевести деньги» внутри вашего невидимого сайта.
    # Как работает:
    # DENY: Запрещает открывать ваш сайт в iframe кому угодно.
    # SAMEORIGIN: Разрешает открывать в iframe только вам самим (на вашем же домене).
    # Зачем вам: Чтобы никто не мог использовать интерфейс вашего приложения в мошеннических целях. В связке с CSP (frame-ancestors) это дает двойную защиту.
    add_header X-Frame-Options "DENY" always;

    # Защита от утечки URL в Referer
    # Этот заголовок управляет тем, какая информация о «предыдущей странице» передается в заголовке Referer при переходе по ссылкам.
    # Проблема: Если пользователь переходит с вашего защищенного сайта на сторонний (например, по ссылке в комментарии), ваш сервер отправляет в заголовке Referer полный URL страницы. Если в URL содержатся токены или конфиденциальные ID (например, ://mysite.com), владелец чужого сайта их увидит.
    # Как работает "strict-origin-when-cross-origin":
    # Если пользователь переходит внутри вашего сайта, передается полный URL.
    # Если пользователь переходит на другой сайт, передается только домен (https://mysite.com), без секретных путей и параметров.
    # Если происходит переход с HTTPS на незащищенный HTTP, данные вообще не передаются.
    # Зачем вам: Это защита приватности и предотвращение утечки токенов, которые случайно могли оказаться в адресной строке.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
