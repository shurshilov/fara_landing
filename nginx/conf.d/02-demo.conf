# =============================================================
# demo.faracrm.com — CRM (FARA)
#
# Архитектурный паттерн: fara-proxy здесь — ОБОЛОЧКА.
# Не знает про /api/, /ws/, /docs-dev/ и прочие внутренности
# faracrm. Делает только три вещи:
#   1. Терминирует TLS (Let's Encrypt).
#   2. Ставит security-заголовки на ВСЕ ответы домена.
#   3. Проксирует ВСЕ запросы на frontend как на чёрный ящик.
#
# Маршрутизация (/api/, /ws/, SPA-fallback) — внутри
# frontend-контейнера, в его собственном nginx. Это позволяет:
#   - faracrm оставаться self-contained (запускается одной командой);
#   - не дублировать список эндпоинтов в двух конфигах;
#   - при изменении внутренних маршрутов CRM не трогать fara-proxy.
# =============================================================

# Map для корректной поддержки WebSocket upgrade в универсальном
# location /. Без него WS-handshake не пройдёт через прокси.
#   - "upgrade" если клиент шлёт Upgrade: websocket
#   - "close"   для обычных HTTP-запросов
#
# ВАЖНО: map должен быть в http { } контексте. Этот файл лежит
# в conf.d/ и подгружается nginx в http { } автоматически — это
# валидно, map тут будет на уровне http.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP → HTTPS редирект + ACME challenge ----
server {
    listen 80;
    server_name demo.faracrm.com;

    # Сертификаты обновляются certbot'ом, нужна публичная папка
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- HTTPS — основной серверный блок ----
server {
    listen 443 ssl;
    http2 on;
    server_name demo.faracrm.com;

    ssl_certificate     /etc/letsencrypt/live/faracrm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/faracrm.com/privkey.pem;

    # Лимит размера тела — общий для всего, что идёт в CRM.
    # Должен быть >= аппликативного лимита attachments в system_settings.
    # 50M = 10М attachment + 33% накладных от base64 + запас на формы.
    client_max_body_size 50M;
    client_body_timeout  300s;

    # ============== Security headers ==============
    # На этом уровне они работают для ВСЕХ ответов demo.faracrm.com:
    # SPA, API, WS-handshake, download attachments. Это и есть смысл
    # делать "оболочечный" прокси — единая точка для policy.

    # Запрет MIME-sniffing — критично для attachments (защита от XSS
    # через SVG/HTML, отправленный с фейковым Content-Type).
    add_header X-Content-Type-Options "nosniff" always;

    # Защита от clickjacking — нашу страницу нельзя засунуть в iframe.
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Не утекать полные URL с параметрами на сторонние сайты/CDN.
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Отключаем браузерные API, которые приложению не нужны.
    # add_header Permissions-Policy
    #     "geolocation=(), microphone=(), camera=(), payment=()" always;

    # ============== Прокси: один location на всё ==============
    location / {
        proxy_pass http://frontend:80;

        # HTTP/1.1 нужен для:
        #   - WebSocket upgrade,
        #   - keep-alive соединений с upstream,
        #   - chunked transfer (streaming download attachment).
        proxy_http_version 1.1;

        # WebSocket upgrade. $connection_upgrade определён в map выше.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Передаём контекст клиента бэкенду через цепочку прокси.
        # Frontend-nginx эти заголовки пробросит дальше в backend.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # Таймауты:
        # 86400s (сутки) — для WS-сессий чата (висят долго).
        # Для обычных HTTP это запас, который не мешает: nginx закроет
        # соединение либо по таймауту, либо когда клиент уйдёт.
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;

        # Не буферизуем ответы:
        # - WS не работает с буферизацией (сообщения копятся);
        # - download больших attachments стримится, а не пишется в
        #   /var/cache/nginx/proxy_temp;
        # - SSE/long-poll (если появятся) тоже требуют off.
        proxy_buffering off;
    }
}